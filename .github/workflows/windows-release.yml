name: Native Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python packages
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test downloader
        run: python -m unittest discover -s tests -v
      - name: Bundle YouTube JavaScript runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1
      - name: Bundle FFmpeg
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1
      - name: Build native app
        run: python build_native.py
      - name: Package portable app
        shell: pwsh
        run: Compress-Archive -Path dist/Clipnest/* -DestinationPath dist/Clipnest_0.2.1_x64-portable.zip
      - name: Build Windows setup
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          Push-Location installer
          & 'C:\Program Files (x86)\NSIS\makensis.exe' /DAPP_VERSION=0.2.1 clipnest.nsi
          Pop-Location
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1
          name: Clipnest v0.2.1 — original interface, Python desktop
          body: |
            Windows: download Clipnest_0.2.1_x64-setup.exe, install it, and open Clipnest from the Start menu.
            The original Clipnest interface now runs in a Python desktop window. A portable ZIP is also available; extract it before opening Clipnest.exe.
            Both include yt-dlp, Node.js, FFmpeg, and the desktop UI runtime.
            See docs/USER_GUIDE.md for folder setup, cookies, and troubleshooting.
          files: |
            dist/Clipnest_0.2.1_x64-portable.zip
            dist/Clipnest_0.2.1_x64-setup.exe
