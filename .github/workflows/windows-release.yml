name: Windows release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          npm ci
      - name: Test workflow
        run: python -m unittest discover -s tests -v
      - name: Build hidden downloader
        run: python build_sidecar.py
      - name: Bundle YouTube JavaScript runtime
        shell: pwsh
        run: ./scripts/prepare_windows_runtime.ps1
      - name: Bundle video merger
        shell: pwsh
        run: ./scripts/prepare_ffmpeg.ps1
      - name: Build and publish installer
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Clipnest v__VERSION__
          releaseBody: |
            Windows setup: download the x64 `.exe` under Assets, run it, and open Clipnest from the Start menu.
            See docs/USER_GUIDE.md for folder setup and troubleshooting.
          releaseDraft: false
          prerelease: false
